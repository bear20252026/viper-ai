<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e14" />
  <title>VIPER AI — AI-Native Flight Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #e0e6ed; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Loading screen */
    #loader { position: fixed; inset: 0; background: linear-gradient(135deg, #0a0e14 0%, #1a1f2e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader h1 { font-size: 3rem; font-weight: 800; letter-spacing: 0.3em; margin-bottom: 0.5rem; background: linear-gradient(90deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #loader p { color: #6b7280; font-size: 0.9rem; letter-spacing: 0.1em; }
    .spinner { width: 40px; height: 40px; border: 3px solid #1a1f2e; border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 2rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* AI Panel */
    #ai-panel { position: fixed; right: 16px; top: 16px; width: 380px; max-height: calc(100vh - 32px); background: rgba(10, 14, 20, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(0, 212, 255, 0.15); border-radius: 12px; display: flex; flex-direction: column; z-index: 100; overflow: hidden; transition: transform 0.3s, opacity 0.3s; }
    #ai-panel.collapsed { transform: translateX(calc(100% - 48px)); }
    #ai-panel.collapsed #ai-body { opacity: 0; pointer-events: none; }
    #ai-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; user-select: none; }
    #ai-header h3 { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; color: #00d4ff; display: flex; align-items: center; gap: 8px; }
    #ai-header h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 8px #00d4ff; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    #ai-toggle { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1.2rem; padding: 0 4px; }
    #ai-body { display: flex; flex-direction: column; flex: 1; min-height: 0; transition: opacity 0.2s; }
    
    /* Chat messages */
    #ai-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; max-height: 400px; }
    #ai-messages::-webkit-scrollbar { width: 4px; }
    #ai-messages::-webkit-scrollbar-track { background: transparent; }
    #ai-messages::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 2px; }
    .msg { padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; max-width: 90%; word-wrap: break-word; animation: msgIn 0.2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.ai { background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.12); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: rgba(123, 47, 247, 0.12); border: 1px solid rgba(123, 47, 247, 0.15); align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.system { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); align-self: center; font-size: 0.75rem; color: #9ca3af; max-width: 95%; }
    .msg.tool { background: rgba(16, 185, 129, 0.06); border: 1px solid rgba(16, 185, 129, 0.12); align-self: flex-start; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.78rem; }
    .msg.tool .tool-name { color: #10b981; font-weight: 600; }
    .msg.tool .tool-args { color: #6b7280; }
    .msg .msg-time { font-size: 0.65rem; color: #4b5563; margin-top: 4px; }
    
    /* Input area */
    #ai-input-area { padding: 12px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px; }
    #ai-input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; color: #e0e6ed; font-size: 0.85rem; outline: none; transition: border-color 0.2s; resize: none; min-height: 40px; max-height: 120px; font-family: inherit; }
    #ai-input:focus { border-color: rgba(0, 212, 255, 0.4); }
    #ai-input::placeholder { color: #4b5563; }
    #ai-send { background: linear-gradient(135deg, #00d4ff, #7b2ff7); border: none; border-radius: 8px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; flex-shrink: 0; }
    #ai-send:hover { opacity: 0.85; }
    #ai-send svg { width: 18px; height: 18px; fill: white; }
    #ai-send:disabled { opacity: 0.4; cursor: not-allowed; }
    
    /* Quick actions */
    #ai-quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
    .quick-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 4px 10px; font-size: 0.72rem; color: #9ca3af; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .quick-btn:hover { background: rgba(0, 212, 255, 0.1); border-color: rgba(0, 212, 255, 0.2); color: #00d4ff; }
    
    /* HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .hud-element { position: absolute; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; color: #00d4ff; text-shadow: 0 0 4px rgba(0,212,255,0.5); }
    #hud-speed { left: 8%; top: 50%; transform: translateY(-50%); }
    #hud-alt { right: 8%; top: 50%; transform: translateY(-50%); text-align: right; }
    #hud-hdg { top: 4%; left: 50%; transform: translateX(-50%); }
    #hud-throttle { left: 50%; bottom: 8%; transform: translateX(-50%); }
    #hud-info { top: 12%; left: 50%; transform: translateX(-50%); font-size: 11px; color: #6b7280; text-shadow: none; }
    
    /* Main menu overlay */
    #menu { position: fixed; inset: 0; background: linear-gradient(135deg, #0a0e14 0%, #1a1f2e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.5s; }
    #menu.hidden { opacity: 0; pointer-events: none; }
    #menu h1 { font-size: 4rem; font-weight: 800; letter-spacing: 0.4em; margin-bottom: 0.25rem; background: linear-gradient(90deg, #00d4ff, #7b2ff7, #00d4ff); background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 3s linear infinite; }
    @keyframes shimmer { to { background-position: 200% center; } }
    #menu .subtitle { color: #6b7280; font-size: 0.85rem; letter-spacing: 0.2em; margin-bottom: 3rem; }
    #menu-buttons { display: flex; flex-direction: column; gap: 12px; width: 280px; }
    .menu-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px 24px; color: #e0e6ed; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 12px; }
    .menu-btn:hover { background: rgba(0, 212, 255, 0.08); border-color: rgba(0, 212, 255, 0.25); transform: translateX(4px); }
    .menu-btn .icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .menu-btn.primary { background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(123,47,247,0.15)); border-color: rgba(0,212,255,0.3); }
    .menu-btn.primary:hover { background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(123,47,247,0.25)); }
    
    /* Tool count badge */
    #tool-count { position: fixed; bottom: 16px; left: 16px; background: rgba(10,14,20,0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 14px; font-size: 0.72rem; color: #6b7280; z-index: 100; }
    #tool-count span { color: #00d4ff; font-weight: 600; }
    
    @media (max-width: 768px) {
      #ai-panel { width: calc(100vw - 32px); right: 16px; left: 16px; }
      #menu h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <!-- Loading -->
  <div id="loader">
    <h1>VIPER AI</h1>
    <p>AI-NATIVE FLIGHT SIMULATOR</p>
    <div class="spinner"></div>
  </div>
  
  <!-- Main Menu -->
  <div id="menu" class="hidden">
    <h1>VIPER AI</h1>
    <p class="subtitle">EVERY FUNCTION IS AN AI TOOL</p>
    <div id="menu-buttons">
      <button class="menu-btn primary" data-mode="free"><span class="icon">✈</span> Free Flight</button>
      <button class="menu-btn" data-mode="dogfight"><span class="icon">⚔</span> Dogfight</button>
      <button class="menu-btn" data-mode="campaign"><span class="icon">📋</span> Campaign</button>
      <button class="menu-btn" data-mode="carrier"><span class="icon">🚢</span> Carrier Launch</button>
      <button class="menu-btn" data-mode="landing"><span class="icon">🎯</span> Landing Practice</button>
    </div>
  </div>
  
  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-element" id="hud-speed">0 KTS</div>
    <div class="hud-element" id="hud-alt">0 FT</div>
    <div class="hud-element" id="hud-hdg">000°</div>
    <div class="hud-element" id="hud-throttle">THR 0%</div>
    <div class="hud-element" id="hud-info">VIPER AI</div>
  </div>
  
  <!-- AI Panel -->
  <div id="ai-panel">
    <div id="ai-header">
      <h3>AI COPILOT</h3>
      <button id="ai-toggle">−</button>
    </div>
    <div id="ai-body">
      <div id="ai-messages"></div>
      <div id="ai-quick">
        <button class="quick-btn" data-cmd="status">📊 Status</button>
        <button class="quick-btn" data-cmd="takeoff">🛫 Takeoff</button>
        <button class="quick-btn" data-cmd="land">🛬 Land</button>
        <button class="quick-btn" data-cmd="weather">🌤 Weather</button>
        <button class="quick-btn" data-cmd="weapons">🎯 Weapons</button>
        <button class="quick-btn" data-cmd="autopilot">🤖 Autopilot</button>
      </div>
      <div id="ai-input-area">
        <textarea id="ai-input" placeholder="Ask AI to do anything... (e.g. 'climb to 20000 feet and turn left to heading 270')" rows="1"></textarea>
        <button id="ai-send" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Tool count -->
  <div id="tool-count"><span>0</span> AI TOOLS LOADED</div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
